<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{width:100vw;height:100vh;display:block}</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script></head>
<body><canvas id="c"></canvas>
<script type="module">
// Инструмент для статичных рендеров проектов: ?variant=...&stage=...&cam=x,y,z,tx,ty,tz&sun=az,el
import { createScene, STAGES } from '../src/scene.js';
const q = new URLSearchParams(location.search);
const s = createScene(document.getElementById('c'), { variant: q.get('variant') || 'cantilever', pixelRatio: 1 });
const st = { ...STAGES[+(q.get('stage') || 0)] };
if (q.get('cam')) { const [cx,cy,cz,tx,ty,tz] = q.get('cam').split(',').map(Number); Object.assign(st,{cx,cy,cz,tx,ty,tz}); }
if (q.get('sun')) { const [a,e] = q.get('sun').split(',').map(Number); st.sunAz=a; st.sunEl=e; }
s.snap(st); s.frame(1);
const rgb = a => `rgb(${a.map(v => Math.round(v * 255)).join(',')})`;
document.body.style.background = `linear-gradient(${rgb(s.cur.sky)}, ${rgb(s.cur.bg)} 62%)`;
window.__done = true;
</script></body></html>
